name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (MSVC, x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Release, x64)
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Test (Release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload built executables
        uses: actions/upload-artifact@v4
        with:
          name: gridengine-windows-x64
          path: |
            build/Release/gridengine_editor.exe
            build/Release/gridengine_game.exe
            build/Release/gridengine_demo.exe
          if-no-files-found: error
          retention-days: 14